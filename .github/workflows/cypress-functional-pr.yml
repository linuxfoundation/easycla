name: Cypress Functional Tests (PR) - runs on *currently* deployed dev API, not the new one from thsi PR 

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  cypress-functional:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/functional

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # System deps for Cypress + xvfb
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2 \
            xauth \
            fonts-liberation \
            xdg-utils \
            ca-certificates

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets and constants
        run: |
          cat > .env <<'EOF'
          APP_URL=https://api-gw.dev.platform.linuxfoundation.org/
          AUTH0_TOKEN_API=https://linuxfoundation-dev.auth0.com/oauth/token
          CYPRESS_ENV=dev

          AUTH0_USER_NAME=${{ secrets.AUTH0_USER_NAME }}
          AUTH0_PASSWORD=${{ secrets.AUTH0_PASSWORD }}
          LFX_API_TOKEN=${{ secrets.LFX_API_TOKEN }}
          AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
          EOF
          echo "Wrote $(pwd)/.env"

      - name: Show Cypress version
        run: npx cypress --version

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Run Cypress (xvfb)
        run: xvfb-run -a npx cypress run

      - name: Upload Cypress Artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/functional/cypress/screenshots
            tests/functional/cypress/videos
          if-no-files-found: ignore

