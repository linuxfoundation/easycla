name: "Security Scanning - Go Backend"
on:
  push:
    branches: [main, dev]
    paths:
      - 'cla-backend-legacy/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'cla-backend-legacy/**'

permissions:
  security-events: write
  contents: read

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    # Gosec security scanner - FIXED to use correct repository
    - name: Run Gosec Security Scanner
      working-directory: ./cla-backend-legacy
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt sarif -out gosec-results.sarif ./...
      continue-on-error: true

    - name: Upload Gosec results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: cla-backend-legacy/gosec-results.sarif
        category: gosec

    # govulncheck - official Go vulnerability scanner
    - name: Go vulnerability check
      working-directory: ./cla-backend-legacy
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # staticcheck for additional Go analysis
    - name: staticcheck
      if: always()
      working-directory: ./cla-backend-legacy
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...
      continue-on-error: true
