name: "Go Dependency Audit"
on:
  push:
    branches: [main, dev]
    paths:
      - 'cla-backend-legacy/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'cla-backend-legacy/**'
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

permissions:
  contents: read
  security-events: write

jobs:
  go-audit:
    name: Go Dependencies Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    # Node runs scripts/govulncheck-filter.mjs
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Official Go vulnerability scanner; called findings are gated by .govulncheck-allowlist.json
    - name: Go vulnerability database check
      working-directory: ./cla-backend-legacy
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck -json ./... > govulncheck-results.json
        node ../scripts/govulncheck-filter.mjs govulncheck-results.json ../.govulncheck-allowlist.json

    - name: Upload vulnerability results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: govulncheck-results
        path: cla-backend-legacy/govulncheck-results.json

    # Check for outdated dependencies
    - name: Check for outdated dependencies
      working-directory: ./cla-backend-legacy
      run: |
        go list -u -m all
        echo "Run 'go get -u all' to update dependencies"
      continue-on-error: true
