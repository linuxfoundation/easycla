type: object
x-nullable: false
title: My CLA Manager
description: A CLA manager from the CCLA signature ACL of an ECLA's company and CLA Group
properties:
  lfUsername:
    type: string
    description: CLA manager LF username - the recipient key for a contact request
  name:
    type: string
    description: Display name, omitted when unknown
  email:
    type: string
    description: Email address, omitted when the user record carries none
