type: object
x-nullable: false
title: My CLA Manager
description: A CLA manager resolved from the CCLA signature ACL of an ECLA's company and CLA Group
properties:
  lfUsername:
    type: string
    description: The CLA manager LF username - the recipient key for the contact request
  name:
    type: string
    description: The CLA manager display name, omitted when unknown
  email:
    type: string
    description: The CLA manager email address, omitted when the user record carries none
