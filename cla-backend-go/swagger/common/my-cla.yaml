type: object
x-nullable: false
title: My CLA
description: A single signed ICLA or ECLA (employee acknowledgement) belonging to the resolved user identity
properties:
  signatureID:
    type: string
    description: The signature ID (UUID)
  claType:
    type: string
    enum: [icla, ecla]
    description: icla - individual CLA with a downloadable signed PDF, ecla - employee acknowledgement covered by the company CCLA, no PDF
  claGroupID:
    type: string
    description: The CLA Group ID (UUID) the agreement was signed against
  claGroupName:
    type: string
    description: The CLA Group name, omitted when the CLA Group record could not be resolved
  projectName:
    type: string
    description: The Salesforce project display name the CLA Group belongs to (a foundation-level CLA Group resolves to its foundation), omitted when it could not be resolved
  projectLogo:
    type: string
    description: The project (or foundation) logo URL, omitted when the project has no logo or could not be resolved
  companyID:
    type: string
    description: The company ID (UUID) of the employer, ECLA only
  companyName:
    type: string
    description: The company name of the employer, ECLA only
  signingEntityName:
    type: string
    description: The company signing entity name of the employer, ECLA only
  userID:
    type: string
    description: The EasyCLA user record ID (UUID) owning this signature
  signedOn:
    type: string
    description: The date/time the agreement was signed or acknowledged
  signed:
    type: boolean
    x-omitempty: false
    description: The signature_signed flag - always true, unsigned records are not returned
  approved:
    type: boolean
    x-omitempty: false
    description: The signature_approved flag - false when the signature was invalidated
  valid:
    type: boolean
    x-omitempty: false
    description: >
      Computed validity. ICLA: signed and approved. ECLA: signed, approved, the employer is
      not sanctioned, the employer still holds an approved+signed CCLA for the CLA Group, and
      the user still matches the current CCLA approval lists (email, email domain,
      GitHub/GitLab username, GitHub organization)
  status:
    type: string
    x-omitempty: false
    enum: [valid, needs_attention, invalidated, unknown]
    description: >
      Contributor-facing standing, independent of approved and valid. valid when coverage
      completed and the user is covered; needs_attention only when coverage completed and
      proved an Approved List miss; invalidated when the stored approval flag is false;
      unknown when coverage could not be evaluated. ICLA is only valid or invalidated.
      invalidated mirrors the stored approval flag and attributes nothing - a CLA manager
      Approved List edit, a project manager invalidating an ICLA, and CLA group deletion all
      produce it, and it does not mean the signature was revoked by sanctions screening.
      This enum is open to extension - a revoked token is expected to be added once
      revocation provenance (timestamp plus reason/actor) exists - so consumers MUST tolerate
      unrecognised status values rather than failing closed.
  statusReason:
    type: string
    enum: [not_on_approval_list, unknown]
    description: >
      Why the standing is not valid. Omitted when status is valid, and on every ICLA.
      Keyed on status, not on the boolean valid field - the two can disagree, so a row
      with valid true can still carry a reason. not_on_approval_list is a completed
      Approved List miss; unknown is every other unevaluable ECLA coverage outcome.
      Only these two tokens exist.
  documentMajorVersion:
    type: integer
    x-omitempty: false
    description: The major version of the CLA document that was signed
  documentMinorVersion:
    type: integer
    x-omitempty: false
    description: The minor version of the CLA document that was signed
  pdfAvailable:
    type: boolean
    x-omitempty: false
    description: >
      True for every signed ICLA; ECLAs have no signed document of their own and are always
      false. Not gated on approved - a flag-off ICLA keeps the affordance because the document
      is the contributor's own signed legal record. Object availability is verified by the PDF
      endpoint on request, and that endpoint enforces its own ownership check, so this field is
      a display hint rather than the security boundary.
