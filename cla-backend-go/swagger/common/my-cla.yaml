type: object
x-nullable: false
title: My CLA
description: A signed ICLA or ECLA (employee acknowledgement) of the resolved user identity
properties:
  signatureID:
    type: string
    description: Signature ID (UUID)
  claType:
    type: string
    enum: [icla, ecla]
    description: icla - individual CLA, PDF downloadable; ecla - employee acknowledgement under the company CCLA, no PDF
  claGroupID:
    type: string
    description: CLA Group ID (UUID) signed against
  claGroupName:
    type: string
    description: CLA Group name, omitted when unresolved
  projectName:
    type: string
    description: Salesforce project display name (the foundation, for a foundation-level CLA Group), omitted when unresolved
  projectLogo:
    type: string
    description: Project (or foundation) logo URL, omitted when absent or unresolved
  companyID:
    type: string
    description: Employer company ID (UUID), ECLA only
  companyName:
    type: string
    description: Employer company name, ECLA only
  signingEntityName:
    type: string
    description: Employer signing entity name, ECLA only
  userID:
    type: string
    description: EasyCLA user record ID (UUID) owning this signature
  signedOn:
    type: string
    description: Date/time signed or acknowledged
  signed:
    type: boolean
    x-omitempty: false
    description: signature_signed flag - always true, unsigned records are not returned
  approved:
    type: boolean
    x-omitempty: false
    description: signature_approved flag - false when the signature was invalidated
  valid:
    type: boolean
    x-omitempty: false
    description: >
      Computed validity. ICLA: signed and approved. ECLA: also requires an unsanctioned employer
      holding a signed+approved CCLA for the CLA Group and the user still matching the current
      CCLA approval lists (email, email domain, GitHub/GitLab username, GitHub organization)
  status:
    type: string
    x-omitempty: false
    enum: [valid, needs_attention, revoked, invalidated, unknown]
    description: >
      Contributor-facing standing, independent of approved and valid. revoked - employer flagged
      by sanctions screening (system-set, no user action, see flagged/flaggedAt); invalidated -
      the stored approval flag is false, which attributes nothing (an Approved List edit, an
      invalidated ICLA and CLA Group deletion all produce it); needs_attention - a completed
      approval-list check proved the user is no longer covered; unknown - ECLA coverage was not
      evaluable; valid otherwise. ICLA is only valid or invalidated. New values may be added in
      future revisions
  statusReason:
    type: string
    enum: [not_on_approval_list, unknown]
    description: >
      Why the standing is not valid; omitted for other statuses and on every ICLA. Keyed on
      status, not on valid - the two can disagree. not_on_approval_list - a completed Approved
      List miss (what a Request approval action gates on); unknown - any other unevaluable ECLA
      coverage outcome
  documentMajorVersion:
    type: integer
    x-omitempty: false
    description: Major version of the signed CLA document
  documentMinorVersion:
    type: integer
    x-omitempty: false
    description: Minor version of the signed CLA document
  pdfAvailable:
    type: boolean
    x-omitempty: false
    description: True for a signed ICLA eligible for PDF retrieval - object availability is verified by the PDF endpoint on request
  signedVia:
    type: string
    enum: [github, gitlab, gerrit]
    description: Platform signed via - gerrit also covers LF SSO signings identified by email
  signedAs:
    type: string
    description: Account signed as - GitHub/GitLab username (numeric ID when no username was recorded) or email for gerrit/LF SSO, omitted when the signature carries no identity
  claManager:
    type: boolean
    x-omitempty: false
    description: True when the resolved user is a CLA manager of the employer's CCLA for this CLA Group - always present, always false on ICLA rows
  flagged:
    type: boolean
    x-omitempty: false
    description: True when the employer is currently flagged by sanctions screening - always present, always false on ICLA rows
  flaggedAt:
    type: string
    description: When EasyCLA set the sanction flag on the employer (its stored sanctioned_date), falling back to the response time when a live screen flagged an employer that carries no stored date; present only when flagged is true
  flaggedCheck:
    type: string
    enum: [live, stored, unavailable]
    description: >
      How flagged was obtained, ECLA only. live - a screening call answered for this response;
      stored - the persisted company flag, because screening is disabled or an administrator set
      the block; unavailable - the call did not complete, so flagged is the persisted value and
      may be stale - treat it as unknown, more so when sssMode is required
