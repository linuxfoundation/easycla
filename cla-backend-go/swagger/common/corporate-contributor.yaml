type: object
properties:
  signatureID:
    description: internal signature ID
    $ref: './common/properties/internal-id.yaml'
    x-omitempty: false
  name:
    type: string
    example: "john doe"
    x-omitempty: false
  linux_foundation_id:
    type: string
    example: "john.doe"
    x-omitempty: false
  github_id:
    type: string
    description: the contributor's GitHub username (login)
    example: "123456"
    x-omitempty: false
  gitlab_id:
    type: string
    description: the contributor's GitLab username (login), mirroring github_id
    example: "jdoe"
    x-omitempty: false
  email:
    type: string
    example: "v1"
    x-omitempty: false
  signature_version:
    type: string
    example: "v1"
    x-omitempty: false
  timestamp:
    type: string
    x-omitempty: false
  userDocusignName:
    type: string
    description: full name used on docusign document
  userDocusignDateSigned:
    type: string
    description: docusign signature date
  signatureModified:
    type: string
    description: the signature modified created time
    example: '2019-05-03T18:59:13.082304+0000'
  signatureSigned:
    type: boolean
    description: the flag for contributor that has been able to sign
    x-omitempty: false
  signatureApproved:
    type: boolean
    description: the flag for contributor that has not yet been approved
    x-omitempty: false
  invalidatedAt:
    type: string
    description: Stored date_invalidated, stamped at the first invalidation - only present on records invalidated after this field was introduced
  invalidatedBy:
    type: string
    description: Who invalidated the acknowledgment (the acting CLA manager's or admin's username) - only present on records invalidated after this field was introduced
  invalidationReason:
    type: string
    description: Invalidation reason - "approved list removal (<criteria>)" for approval-list removals, or the reason given by the invalidating manager/admin - only present on records invalidated with a reason
  invalidationNote:
    type: string
    description: Free-text invalidation note - only present on records invalidated with a note
  note:
    type: string
    description: The signature note - approval-list removals and PCC invalidations record what happened here, including on records predating the invalidation attributes above
