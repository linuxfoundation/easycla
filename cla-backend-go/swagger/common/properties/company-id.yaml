# EasyCLA company reference: the internal UUIDv4 of a persisted row, or the Salesforce ID for an
# organization that has no EasyCLA row yet (virtual, not persisted).
type: string
example: 'a1b86c26-d8e8-4fd8-9f8d-5c723d5dac9f'
pattern: '^([a-fA-F0-9]{8}-?[a-fA-F0-9]{4}-?4[a-fA-F0-9]{3}-?[89ab][a-fA-F0-9]{3}-?[a-fA-F0-9]{12}|[0-9A-Za-z]{15}|[0-9A-Za-z]{18})$'
