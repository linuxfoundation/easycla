type: object
x-nullable: false
title: Company CLA Group
description: A CCLA of one signing entity under one CLA group
properties:
  companyID:
    type: string
    x-omitempty: false
    description: Signing entity company ID (UUID)
  companySFID:
    type: string
    x-omitempty: false
    description: Company external Salesforce ID
  companyName:
    type: string
    x-omitempty: false
    description: Company name
  signingEntityName:
    type: string
    x-omitempty: false
    description: Signing entity name, the company name when the record has none
  claGroupID:
    type: string
    x-omitempty: false
    description: CLA Group ID (UUID)
  claGroupName:
    type: string
    x-omitempty: false
    description: CLA Group name
  foundationSFID:
    type: string
    x-omitempty: false
    description: Salesforce foundation ID of the CLA Group
  foundationName:
    type: string
    x-omitempty: false
    description: Foundation name
  projects:
    type: array
    x-omitempty: false
    description: Salesforce projects covered by the CLA Group, sorted by projectName
    items:
      $ref: '#/definitions/company-cla-group-project'
  signed:
    type: boolean
    x-omitempty: false
    description: Whether the CCLA is signed
  signedOn:
    type: string
    description: >-
      Stored signing date/time of the CCLA (signed_on). Omitted when the
      signature carries none - there is no creation-date fallback.
  signedBy:
    type: string
    description: >-
      Name on the CCLA signature (SignatoryName). Omitted when that
      name is empty. There is no CLA-manager fallback.
  signatureID:
    type: string
    x-omitempty: false
    description: CCLA signature ID (UUID)
  sanctioned:
    type: boolean
    x-omitempty: false
    description: Stored sanctions flag of the signing entity company
  sanctionedAt:
    type: string
    description: >-
      Date/time the signing entity company was flagged as sanctioned
      (stored sanctionedDate). Only present while sanctioned is true.
  approvedContributorsCount:
    type: integer
    format: int64
    x-omitempty: false
    description: Number of approved and signed employee acknowledgments under this CCLA
  approvalCriteriaCount:
    type: integer
    format: int64
    x-omitempty: false
    description: >-
      Number of approval criteria entries on the CCLA, summed across all six lists
      (email, email domain, GitHub username, GitHub org, GitLab username, GitLab group).
      These are rules granting coverage, not people - one domain rule can cover a whole
      company, so this is unrelated to approvedContributorsCount
  claManagersCount:
    type: integer
    format: int64
    x-omitempty: false
    description: Number of CLA managers on the CCLA signature ACL
  claManagers:
    type: array
    x-omitempty: false
    description: CLA managers from the CCLA signature ACL, sorted by lfUsername
    items:
      $ref: '#/definitions/company-cla-group-manager'
  needsClaManager:
    type: boolean
    x-omitempty: false
    description: True when the CCLA is signed but has no CLA managers
  autoCreateECLA:
    type: boolean
    x-omitempty: false
    description: Whether employee acknowledgments are created automatically for approved contributors
