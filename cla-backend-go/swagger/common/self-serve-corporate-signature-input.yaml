type: object
x-nullable: false
title: Self Serve Corporate Signature Input
description: The corporate signature request started from LFX Self Serve - the corporate-signature-input fields plus the two Self Serve attestations, both of which must be true
required:
  - project_sfid
  - company_sfid
properties:
  project_sfid:
    type: string
    example: 'a0941000005ouJFAAY'
    description: salesforce id of the project
  company_sfid:
    type: string
    example: '0014100000Te0fMAAR'
    description: salesforce id of the company
  signing_entity_name:
    type: string
    example: 'My Company Signing Entity, Ltd.'
    description: the corporate signing entity name used for signing the CLA, may be the same as the company name or a different value
  send_as_email:
    type: boolean
    example: false
    description: send signing request as email. This should be set to true when requestor is not signatory.
  authority_name:
    type: string
    example: "Derk Miyamoto"
    description: the name of the CLA signatory
    minLength: 2
    maxLength: 255
  authority_email:
    $ref: './common/properties/email.yaml'
    description: the email of the CLA Signatory
  return_url:
    type: string
    example: 'https://corporate.dev.lfcla.com/#/company/eb4d7d71-693f-4047-bf8d-10d0e7764969'
    description: on signing the document, page will get redirected to this url. This is valid only when send_as_email is false
    format: uri
  authority_acked:
    type: boolean
    x-omitempty: false
    example: true
    description: attestation that the caller is the signing authority for the company, or has named the signing authority via authority_name/authority_email - must be true
  embargo_acked:
    type: boolean
    x-omitempty: false
    example: true
    description: attestation that the caller acknowledges the embargo terms - must be true
