type: object
x-nullable: false
title: Self Serve Corporate Signature Input
description: The corporate signature request started from LFX Self Serve - the corporate-signature-input fields plus the selected CLA group and two Self Serve attestations. Both attestations must be true on self-sign; when send_as_email is true they are not required and cla_group_id, authority_name and authority_email are required instead. A selected CLA group that does not match the project's signing group is rejected before creating or emailing a signing envelope
required:
  - project_sfid
  - company_sfid
properties:
  cla_group_id:
    type: string
    example: 'aa47b3e1-6f9c-4b6a-9f16-0f9d6a2e1c11'
    description: The CLA Group UUID selected in Self Serve, in hyphenated or compact form, case-insensitive. Required when send_as_email is true; optional on self-sign for compatibility. When provided it must match the CLA group actually used to sign for project_sfid, otherwise the request fails with HTTP 400 before signing side effects
  project_sfid:
    type: string
    example: 'a0941000005ouJFAAY'
    description: salesforce id of the project
  company_sfid:
    type: string
    example: '0014100000Te0fMAAR'
    description: salesforce id of the company
  signing_entity_name:
    type: string
    example: 'My Company Signing Entity, Ltd.'
    description: the corporate signing entity name used for signing the CLA, may be the same as the company name or a different value
  send_as_email:
    type: boolean
    example: false
    description: send signing request as email. Set to true when the requestor is not the signatory - then cla_group_id, authority_name and authority_email are required and the attestations are not
  authority_name:
    type: string
    example: "Derk Miyamoto"
    description: the name of the CLA signatory
    minLength: 2
    maxLength: 255
  authority_email:
    $ref: './common/properties/email.yaml'
    description: the email of the CLA Signatory
  return_url:
    type: string
    example: 'https://corporate.dev.lfcla.com/#/company/eb4d7d71-693f-4047-bf8d-10d0e7764969'
    description: on signing the document, page will get redirected to this url. This is valid only when send_as_email is false
    format: uri
  authority_acked:
    type: boolean
    x-omitempty: false
    example: true
    description: attestation that the caller is the signing authority for the company - must be true unless send_as_email is true
  embargo_acked:
    type: boolean
    x-omitempty: false
    example: true
    description: attestation that the caller acknowledges the embargo terms - must be true unless send_as_email is true
