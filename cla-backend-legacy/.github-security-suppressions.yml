# Security suppressions for cla-backend-legacy
# This file contains security warnings that are acceptable for legacy Python compatibility
# These are documented design decisions, not security vulnerabilities in this context

suppressions:
  - rule: "go/uncontrolled-data-in-network-request"
    reason: "Legacy GitHub API validation endpoints require dynamic URLs for 1:1 Python compatibility"
    paths:
      - "internal/legacy/github/service.go"
    
  - rule: "go/log-injection"
    reason: "Legacy logging format maintains exact Python log compatibility with sanitization"
    paths:
      - "internal/logging/logging.go"
      
  - rule: "go/useless-assignment"
    reason: "Fields maintained for API compatibility with Python, mirroring exact behavior"
    paths:
      - "internal/api/handlers.go"
      
  - rule: "go/reflected-xss"
    reason: "Legacy response format required for Python compatibility, contexts are server-side"
    paths:
      - "internal/api/handlers.go"
