  environment:
    STAGE: ${sls:stage}
    # CORS allowlist used by internal/middleware/cors.go. The value is sourced from SSM
    # (cla-allowed-origins-${stage}) or env.json and may be JSON array or CSV.
    ALLOWED_ORIGINS: ${self:custom.allowed_origins}
    # Default unfinished-route proxy target. This follows the opposite domain slot from
    # the selected Go deployment. Override from deploy-time env or env.json if you need a
    # non-standard cutover sequence.
    LEGACY_UPSTREAM_BASE_URL: ${env:LEGACY_UPSTREAM_BASE_URL, file(./env.json):legacy-upstream-base-url-${sls:stage}, self:custom.legacyUpstreamByGoSlot.${self:custom.apiDomainSlot}.${sls:stage}, self:custom.legacyUpstreamByGoSlot.${self:custom.apiDomainSlot}.other}
    HOME: /tmp
    REGION: us-east-1
    DYNAMODB_AWS_REGION: us-east-1
    GH_APP_WEBHOOK_SECRET: ${file(./env.json):gh-app-webhook-secret, ssm:/cla-gh-app-webhook-secret-${sls:stage}}
    GH_APP_ID: ${file(./env.json):gh-app-id, ssm:/cla-gh-app-id-${sls:stage}}
    GH_OAUTH_CLIENT_ID: ${file(./env.json):gh-oauth-client-id, ssm:/cla-gh-oauth-client-id-${sls:stage}}
    GH_OAUTH_SECRET: ${file(./env.json):gh-oauth-secret, ssm:/cla-gh-oauth-secret-${sls:stage}}
    GITHUB_OAUTH_TOKEN: ${file(./env.json):gh-access-token, ssm:/cla-gh-access-token-${sls:stage}}
    GITHUB_APP_WEBHOOK_SECRET: ${file(./env.json):gh-app-webhook-secret, ssm:/cla-gh-app-webhook-secret-${sls:stage}}
    GH_STATUS_CTX_NAME: EasyCLA
    AUTH0_DOMAIN: ${file(./env.json):auth0-domain, ssm:/cla-auth0-domain-${sls:stage}}
    AUTH0_CLIENT_ID: ${file(./env.json):auth0-clientId, ssm:/cla-auth0-clientId-${sls:stage}}
    AUTH0_USERNAME_CLAIM: ${file(./env.json):auth0-username-claim, ssm:/cla-auth0-username-claim-${sls:stage}}
    AUTH0_USERNAME_CLAIM_CLI: ${file(./env.json):auth0-username-cli-claim, ssm:/cla-auth0-username-claim-cli-${sls:stage},
      env:AUTH0_USERNAME_CLAIM_CLI, ''}
    AUTH0_EMAIL_CLAIM_CLI: ${file(./env.json):auth0-email-cli-claim, ssm:/cla-auth0-email-claim-cli-${sls:stage},
      env:AUTH0_EMAIL_CLAIM_CLI, ''}
    AUTH0_NAME_CLAIM_CLI: ${file(./env.json):auth0-name-cli-claim, ssm:/cla-auth0-name-claim-cli-${sls:stage},
      env:AUTH0_NAME_CLAIM_CLI, ''}
    AUTH0_ALGORITHM: ${file(./env.json):auth0-algorithm, ssm:/cla-auth0-algorithm-${sls:stage}}
