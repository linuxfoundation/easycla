plugins:
- serverless-plugin-tracing
- serverless-prune-plugin
- serverless-domain-manager
functions:
  apiv1:
    handler: bin/legacy-api-lambda
    description: EasyCLA Python API handler for the /v1 endpoints
    events:
    - http:
        method: ANY
        path: v1/{proxy+}
        cors: true
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
  apiv2:
    handler: bin/legacy-api-lambda
    description: EasyCLA Python API handler for the /v2 endpoints
    events:
    - http:
        method: ANY
        path: v2/{proxy+}
        cors: true
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
  salesforceprojects:
    handler: bin/legacy-api-lambda
    description: EasyCLA API Callback Handler for fetching all SalesForce projects
    events:
    - http:
        method: ANY
        path: v1/salesforce/projects
        cors: true
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
  salesforceprojectbyID:
    handler: bin/legacy-api-lambda
    description: EasyCLA API Callback Handler for fetching SalesForce projects by
      ID
    events:
    - http:
        method: ANY
        path: v1/salesforce/project
        cors: true
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
  githubinstall:
    handler: bin/legacy-api-lambda
    description: EasyCLA API Callback Handler for GitHub bot installations
    events:
    - http:
        method: ANY
        path: v2/github/installation
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
  githubactivity:
    handler: bin/legacy-api-lambda
    description: EasyCLA API Callback Handler for GitHub activity
    events:
    - http:
        method: POST
        path: v2/github/activity
    layers:
    - ${self:custom.datadog.extensionLayerArn}
    runtime: go1.x
resources:
  Conditions:
    isProd:
      Fn::Equals:
      - ${env:STAGE}
      - prod
    isStaging:
      Fn::Equals:
      - ${env:STAGE}
      - staging
    isDev:
      Fn::Equals:
      - ${env:STAGE}
      - dev
    isNotProd:
      Fn::Or:
      - Condition: isDev
      - Condition: isStaging
    ShouldGenerateCertificate:
      Fn::Not:
      - Fn::Equals:
        - ${env:STAGE}
        - prod
  Resources:
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: ${self:service}-${sls:stage}
        Description: EasyCLA API Gateway
    GatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
          gatewayresponse.header.Access-Control-Allow-Headers: '''*'''
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
    Cert:
      Type: AWS::CertificateManager::Certificate
      Condition: ShouldGenerateCertificate
      Properties:
        DomainName: ${self:custom.product.domain.${self:custom.apiDomainSlot}.name.${sls:stage}, self:custom.product.domain.${self:custom.apiDomainSlot}.name.other}
        SubjectAlternativeNames:
        - ${self:custom.product.domain.${self:custom.apiDomainSlot}.alt.${sls:stage}, self:custom.product.domain.${self:custom.apiDomainSlot}.alt.other}
        ValidationMethod: DNS
  Outputs:
    APIGatewayRootResourceID:
      Value:
        Fn::GetAtt:
        - ApiGatewayRestApi
        - RootResourceId
      Export:
        Name: APIGatewayRootResourceID
